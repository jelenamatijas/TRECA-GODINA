services:
  dev:
    build: .
    container_name: dev_kernel
    volumes:
      # Mount the current directory to persist source files
      - .:/workspace
    working_dir: /workspace
    # Keep container running
    stdin_open: true
    tty: true
    # Add security capabilities for debugging
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
