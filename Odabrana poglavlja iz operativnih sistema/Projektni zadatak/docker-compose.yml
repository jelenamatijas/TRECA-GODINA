services:
  dev:
    image: opos
    build: 
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      - spark-master
      - spark-connect
    networks:
      - spark-net
    command: sleep infinity

  spark-master:
    image: apache/spark:4.0.1
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/sbin/start-master.sh", "-h", "spark-master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/workspace
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:4.0.1
    container_name: spark-worker-1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=4
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - .:/workspace
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:4.0.1
    container_name: spark-worker-2
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=4
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - .:/workspace
    networks:
      - spark-net

  spark-connect:
    image: apache/spark:4.0.1
    container_name: spark-connect
    environment:
      - SPARK_NO_DAEMONIZE=true
    command:
      [
        "/opt/spark/sbin/start-connect-server.sh",
        "--conf",
        "spark.master=spark://spark-master:7077",
        "--conf",
        "spark.connect.grpc.binding.port=15002",
        "--conf",
        "spark.executor.cores=1",
        "--conf",
        "spark.executor.instances=2",
        "--conf",
        "spark.cores.max=2",
      ]
    depends_on:
      - spark-master
    ports:
      - "15002:15002"
    volumes:
      - .:/workspace
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge